name: Build and test source preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Audit public source
        shell: pwsh
        run: ./scripts/Audit-PublicSource.ps1
      - name: Build, vet, and run unit tests
        shell: pwsh
        run: ./scripts/Build.ps1
      # No driver installation, microphone capture, or binary publishing in CI.
